name: Publier sur GitHub Pages

# Publication manuelle, ou à chaque poussée sur la branche par défaut.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Le jeton du workflow ne peut qu'écrire la page : rien d'autre du dépôt.
permissions:
  contents: read
  pages: write
  id-token: write

# Une publication à la fois ; une nouvelle attend que la précédente finisse.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Le site n'est publié que si tout est au vert.
      - run: npm run lint
      - run: npm run test
      - run: npm run build
        env:
          # GitHub Pages sert le site sous /<dépôt>/, pas à la racine.
          PAGES_BASE: /${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
